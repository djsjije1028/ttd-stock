<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TTD주식</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#0b0b0b; color:#ffd700; font-family:Arial,sans-serif; text-align:center; }
    .box { max-width:560px; margin:40px auto; padding:22px; border:2px solid gold; border-radius:16px;
           box-shadow:0 0 18px rgba(255,215,0,.35); }
    h1 { font-size:38px; margin:0 0 10px; }
    .price { font-size:30px; margin:18px 0; }
    .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    button { background:gold; color:#000; border:0; padding:10px 18px; font-size:16px; border-radius:10px;
             cursor:pointer; margin:4px; }
    button:hover { filter:brightness(1.08); }
    #countdown { margin-top:10px; font-size:14px; opacity:.85; }
    .hint { margin-top:6px; font-size:12px; opacity:.7; }
  </style>
</head>
<body>

  <div class="box">
    <h1>TTD주식</h1>

    <div class="price">
      현재가: <b><span id="price">0</span></b> 원
    </div>

    <div class="row">
      <button id="manualBtn">AI 주가 변동(수동)</button>
      <button id="autoBtn">자동 변동 시작(10분)</button>
      <button id="reloadBtn">서버값 다시 불러오기</button>
    </div>

    <div id="countdown">자동 변동: 꺼짐</div>
    <div class="hint">변동폭: -2% ~ +2% (폭주 방지)</div>

    <canvas id="chart" style="margin-top:18px;"></canvas>
  </div>

  <script>
    let price = 100000;

    let autoTimer = null;
    let countdownTimer = null;
    let nextTickAt = null;

    const AUTO_INTERVAL_MS = 10 * 60 * 1000; // 10분

    const prices = [];
    const labels = [];

    const chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "TTD주식",
          data: prices,
          borderColor: "gold",
          tension: 0.25
        }]
      }
    });

    function renderHistory(hist) {
      prices.length = 0;
      labels.length = 0;
      hist.forEach((p, i) => {
        prices.push(p);
        labels.push(i + 1);
      });
      chart.update();
    }

    async function loadAll() {
      const res = await fetch("/price", { cache: "no-store" });
      const data = await res.json();

      price = data.price ?? 100000;
      document.getElementById("price").innerText = price;

      const hist = Array.isArray(data.history) ? data.history : [price];
      renderHistory(hist);
    }

    async function savePrice(p) {
      const res = await fetch("/price", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ price: p })
      });
      if (!res.ok) throw new Error("저장 실패");
    }

    // ✅ 폭주 방지: -2% ~ +2%
    function calcNextPrice() {
      const change = (Math.random() * 4 - 2) / 100; // -2% ~ +2%
      return Math.max(1, Math.round(price + price * change));
    }

    async function changePrice() {
      const next = calcNextPrice();
      await savePrice(next);
      await loadAll(); // 서버 history 다시 불러오기 (F5와 동일 기준)
    }

    function updateCountdown() {
      const el = document.getElementById("countdown");
      if (!nextTickAt) {
        el.innerText = "자동 변동: 꺼짐";
        return;
      }
      const left = Math.max(0, nextTickAt - Date.now());
      const sec = Math.ceil(left / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      el.innerText = `다음 자동 변동까지 ${m}:${s}`;
    }

    function toggleAuto() {
      const btn = document.getElementById("autoBtn");

      // 끄기
      if (autoTimer) {
        clearInterval(autoTimer);
        clearInterval(countdownTimer);
        autoTimer = null;
        countdownTimer = null;
        nextTickAt = null;
        btn.innerText = "자동 변동 시작(10분)";
        updateCountdown();
        return;
      }

      // 켜기: 시작하자마자 1번 변동
      changePrice();

      nextTickAt = Date.now() + AUTO_INTERVAL_MS;

      autoTimer = setInterval(() => {
        changePrice();
        nextTickAt = Date.now() + AUTO_INTERVAL_MS;
      }, AUTO_INTERVAL_MS);

      countdownTimer = setInterval(updateCountdown, 1000);
      updateCountdown();

      btn.innerText = "자동 변동 중지";
    }

    document.getElementById("manualBtn").onclick = changePrice;
    document.getElementById("autoBtn").onclick = toggleAuto;
    document.getElementById("reloadBtn").onclick = loadAll;

    loadAll();
  </script>

</body>
</html>
